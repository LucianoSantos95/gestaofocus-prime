    <script>
      (function () {
        if (typeof window === 'undefined') return;
        var loaded = false;
        var idle = window.requestIdleCallback || function (cb) { return setTimeout(cb, 1); };

          var s = document.createElement('script');
          s.src = src;
          s.async = true;
          if (attrs) Object.keys(attrs).forEach(function (k) { s.setAttribute(k, attrs[k]); });
          document.head.appendChild(s);
          return s;
        }

        function loadThirdParties() {
          if (loaded) return;
          loaded = true;

          ga.onload = function () {

          }, 4000);

          // ElevenLabs Conversational widget — only if used elsewhere; keep deferred
          setTimeout(function () {
            loadScript('https://elevenlabs.io/convai-widget/index.js');
          }, 5000);
        }

        // Trigger on first user interaction OR after idle (max 4s)
        var events = ['scroll', 'mousemove', 'touchstart', 'keydown', 'click'];
        function onFirstInteraction() {
          events.forEach(function (e) { window.removeEventListener(e, onFirstInteraction, { passive: true }); });
          loadThirdParties();
        }
        events.forEach(function (e) { window.addEventListener(e, onFirstInteraction, { passive: true, once: true }); });
        window.addEventListener('load', function () {
          idle(function () { setTimeout(loadThirdParties, 2500); });
        });
      })();
